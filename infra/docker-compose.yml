services:
  mongodb:
    image: mongo:6.0
    container_name: pokemon-mongo
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ../Server
      dockerfile: Dockerfile
    container_name: pokemon-server
    ports:
      - "${SERVER_PORT}:2567"
    depends_on:
      - mongodb
    environment:
      - MongoDb__ConnectionString=mongodb://mongodb:27017
      - MongoDb__DatabaseName=pokemon_mmo
      - ASPNETCORE_ENVIRONMENT=Development

volumes:
  mongo-data:
